
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>JobAtlas DE | Jobs in Deutschland</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #17233b;
    }

    header {
      background: #102b54;
      color: white;
      text-align: center;
      padding: 48px 20px;
    }

    header h1 {
      font-size: 38px;
      margin: 0 0 12px;
    }

    main {
      max-width: 1050px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0;
    }

    input, select {
      padding: 14px;
      border: 1px solid #d4dce7;
      border-radius: 8px;
      background: white;
      font-size: 15px;
      flex: 1;
      min-width: 170px;
    }

    .job {
      background: white;
      border: 1px solid #e5eaf1;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 15px;
    }

    .job h3 {
      margin: 0 0 10px;
      color: #102b54;
    }

    .job p {
      color: #526176;
      margin: 8px 0;
    }

    .apply {
      display: inline-block;
      background: #1769c2;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 12px;
    }

    .apply:hover {
      background: #0e4d94;
    }

    #status {
      color: #526176;
      margin-bottom: 20px;
    }

    .error { color: #b42318 !important; }

    footer {
      text-align: center;
      padding: 30px;
      color: #66758a;
    }
  </style>
</head>

<body>
  <header>
    <h1>JobAtlas DE</h1>
    <p>Entdecke deinen nächsten Job in Deutschland</p>
  </header>

  <main>
    <h2>Aktuelle Stellenangebote</h2>

    <div class="filters">
      <input
        id="search"
        type="search"
        placeholder="Jobtitel, Firma oder Stadt"
      >

      <select id="language">
        <option value="all">Alle Sprachen</option>
        <option value="de">Deutsch</option>
        <option value="en">English</option>
        <option value="unknown">Nicht erkannt</option>
      </select>
    </div>

    <p id="status">Stellenangebote werden geladen...</p>
    <div id="jobs"></div>
  </main>

  <footer>
    JobAtlas DE · Stellenangebote aus externen Quellen
  </footer>

  <script>
    let allJobs = [];

    const searchInput = document.getElementById("search");
    const languageSelect = document.getElementById("language");
    const jobsContainer = document.getElementById("jobs");
    const status = document.getElementById("status");

    function renderJobs() {
      const query = searchInput.value
        .toLocaleLowerCase("de").trim();

      const language = languageSelect.value;

      const filtered = allJobs.filter(job => {
        const text = [
          job.title,
          job.company,
          job.city
        ].join(" ").toLocaleLowerCase("de");

        const matchesSearch = text.includes(query);

        const matchesLanguage =
          language === "all" ||
          job.language === language;

        return matchesSearch && matchesLanguage;
      });

      jobsContainer.replaceChildren();

      status.textContent =
        filtered.length + " Stellenangebote gefunden";

      if (filtered.length === 0) {
        const empty = document.createElement("p");
        empty.textContent =
          "Keine passenden Stellenangebote gefunden.";
        jobsContainer.appendChild(empty);
        return;
      }

      filtered.forEach(job => {
        const card = document.createElement("article");
        card.className = "job";

        const title = document.createElement("h3");
        title.textContent = job.title || "Ohne Titel";

        const company = document.createElement("p");
        company.textContent =
          "Unternehmen: " + (job.company || "Unbekannt");

        const location = document.createElement("p");
        location.textContent =
          "Standort: " + (job.city || "Nicht angegeben");

        const languageText = document.createElement("p");

        const languages = {
          de: "Deutsch",
          en: "English",
          unknown: "Nicht erkannt"
        };

        languageText.textContent =
          "Sprache: " +
          (languages[job.language] || "Nicht erkannt");

        card.append(title, company, location, languageText);

        if (job.url) {
          try {
            const url = new URL(job.url);

            if (url.protocol === "https:" ||
                url.protocol === "http:") {
              const link = document.createElement("a");
              link.className = "apply";
              link.href = url.href;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              link.textContent = "Originalanzeige öffnen";
              card.appendChild(link);
            }
          } catch (error) {
            console.warn("Ungültiger Link:", job.id);
          }
        }

        jobsContainer.appendChild(card);
      });
    }

    async function loadJobs() {
      try {
        const response = await fetch("./jobs.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data.jobs)) {
          throw new Error("Ungültiges Datenformat");
        }

        allJobs = data.jobs;
        renderJobs();

      } catch (error) {
        console.error(error);
        status.textContent =
          "Stellenangebote konnten nicht geladen werden.";
        status.className = "error";
      }
    }

    searchInput.addEventListener("input", renderJobs);
    languageSelect.addEventListener("change", renderJobs);

    loadJobs();
  </script>
</body>
</html>
